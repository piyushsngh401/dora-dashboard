services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dora
      POSTGRES_USER: dora
      POSTGRES_PASSWORD: dora
    ports:
      - "5432:5432"
    volumes:
      - dora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dora-postgres-data:
