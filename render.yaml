# Render "Blueprint" spec: connect this repo at render.com/select-repo and Render provisions
# everything below in one go (a free Postgres instance, the API as a Docker web service, and the
# React dashboard as a static site) instead of clicking through three separate setup screens.
#
# Two values you'll still set by hand in the Render dashboard after the first deploy:
#   1. GitHub__Token on dora-dashboard-api (secret — never goes in this file or git)
#   2. VITE_API_BASE_URL on dora-dashboard-web, once you know the API's actual assigned URL
#      (Render usually honors the service name below, but appends a suffix if it's taken)

databases:
  - name: dora-dashboard-db
    plan: free
    databaseName: dora
    user: dora

services:
  - type: web
    name: dora-dashboard-api
    runtime: docker
    plan: free
    dockerfilePath: ./src/Api/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dora-dashboard-db
          property: connectionString
      - key: Dora__AutoMigrate
        value: "true"
      - key: Cors__WebOrigin
        value: https://dora-dashboard-web.onrender.com
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Belt-and-suspenders alongside Api.csproj's <ServerGarbageCollection>false</...> — the free
      # instance's memory ceiling is tight enough that Server GC's per-core heap sizing crashes
      # the process (exit 139/SIGSEGV) before it finishes starting.
      - key: DOTNET_gcServer
        value: "0"
      # ASP.NET Core watches appsettings*.json for changes by default, via a native
      # FileSystemWatcher/inotify call — Render's sandboxed free-tier containers don't support
      # that the way a normal Linux host does, and it crashes the process (SIGSEGV/139) during
      # startup, right as it's building configuration. There's never a reason to hot-reload config
      # in a container anyway (a config change means a redeploy), so just turn the watch off.
      - key: DOTNET_hostBuilder__reloadConfigOnChange
        value: "false"
      - key: GitHub__Token
        sync: false

  - type: web
    name: dora-dashboard-web
    runtime: static
    # No `plan` field here: Render static sites aren't tiered like web/database services are —
    # they're just free hosting, and Render's Blueprint validator rejects a "free" plan here as
    # unrecognized ("no such plan free for service type web") for that reason.
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dora-dashboard-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
